<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./assets/favicon/gemini-favicon.ico" type="image/x-icon">
    <title> Modelo Prompts | Genio 🧞 IA Web Local </title>

    <link rel="preload" href="./css/view-transition.css" as="style">
    <link rel="stylesheet" href="./css/view-transition.css">

    <link rel="preload" href="./css/styles.css" as="style">
    <link rel="stylesheet" href="./css/styles.css">

    <script src="./js/main.js" defer> </script>

</head>

<body>

    <header class="header">

        <img class="header__logo" src="./assets/img/gemini-logo.avif" alt="Logo Gemini Nano">

        <h1 class="header__title"> Curso IA Web Local <br> Gemini Nano </h1>

        <img class="header__logo" src="./assets/img/gemini-logo.avif" alt="Logo Gemini Nano">


    </header>

    <main class="main">

        <h2 class="main__header">
            
            <span class="header__genius"> 🧞</span>
            Genio Gemini Nano <br> Modelo Prompts para IA Web Local
            <span class="header__genius"> 🧞</span>

        </h2>

        <section class="main__container">

            <label for="userInput">
                <span> 💬 </span>
                Escribe tu pregunta al genio:
            </label>

            <input type="text" id="userInput" placeholder="Ejemplo: ¿Cuál es la mejor playa de Murcia?" >

            <button id="askGeniusBtn"> 🤲 Pedir deseo </button>

            <div id="status">
                <!--  -----  Aquí se mostrará el estado de la solicitud o Estadio del Genio  -----  -->
            </div>

            <div id="response">
                <!--  -----  Aquí se mostrará la respuesta del Genio  -----  -->
            </div>

        </section>
                     
       
    </main>

</body>

</html>
